[project]
name = "messenger-automation"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "devtrung", email = "vuthanhtrungsuper@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "camoufox[geoip]>=0.5.9",
    "celery[redis]>=5.4",
    "channels>=4.2",
    "channels-redis>=4.2",
    "daphne>=4.1",
    "django>=5.1",
    "pillow>=10.4",
    "psycopg[binary]>=3.2",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-django>=4.9",
]

[project.scripts]
messenger-automation = "messenger_automation:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"
