{% extends 'base.html' %}

{% block title %}Sign In - Messenger Automation{% endblock %}

{% block content %}
<div class="min-h-[70vh] flex flex-col justify-center items-center">
    <div class="w-full max-w-md bg-slate-900 border border-slate-800 rounded-2xl p-8 shadow-2xl">
        <div class="text-center mb-6">
            <div class="inline-flex items-center justify-center w-12 h-12 rounded-xl bg-blue-600/20 text-blue-400 mb-3 border border-blue-500/30">
                <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 24 24"><path d="M12 2C6.477 2 2 6.145 2 11.258c0 2.91 1.455 5.518 3.735 7.21V22l3.39-1.86c.928.257 1.91.396 2.875.396 5.523 0 10-4.145 10-9.258C22 6.145 17.523 2 12 2zm1.066 12.443l-2.583-2.755-5.044 2.755 5.547-5.888 2.651 2.755 4.976-2.755-5.547 5.888z"/></svg>
            </div>
            <h1 class="text-2xl font-bold text-white">Admin Sign In</h1>
            <p class="text-xs text-slate-400 mt-1">Manage Facebook Messenger accounts and schedules</p>
        </div>

        <form method="post" class="space-y-4">
            {% csrf_token %}
            <div>
                <label for="username" class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1">Username</label>
                <input type="text" id="username" name="username" required autofocus class="w-full px-4 py-2.5 rounded-lg bg-slate-800 border border-slate-700 text-white placeholder-slate-500 focus:outline-none focus:border-blue-500 transition-colors">
            </div>

            <div>
                <label for="password" class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1">Password</label>
                <input type="password" id="password" name="password" required class="w-full px-4 py-2.5 rounded-lg bg-slate-800 border border-slate-700 text-white placeholder-slate-500 focus:outline-none focus:border-blue-500 transition-colors">
            </div>

            <button type="submit" class="w-full py-2.5 px-4 rounded-lg bg-blue-600 hover:bg-blue-500 text-white font-medium text-sm transition-colors shadow-lg shadow-blue-600/30">
                Sign In
            </button>
        </form>
    </div>
</div>
{% endblock %}
