<form method="get" action="{{ action_url }}" class="flex flex-col gap-3 rounded-2xl border border-border bg-surface p-4 sm:flex-row sm:items-center">
    <div class="relative min-w-0 flex-1">
        <label for="filter-q" class="sr-only">Search</label>
        <input
            type="search"
            id="filter-q"
            name="q"
            value="{{ search_query|default:'' }}"
            placeholder="{{ placeholder|default:'Search by name, ID, or account...' }}"
            class="h-10 w-full rounded-xl border border-border-strong bg-surface px-3.5 text-sm text-foreground placeholder:text-muted outline-hidden transition-colors focus:border-focus focus:ring-2 focus:ring-focus"
        >
    </div>
    <div class="flex flex-wrap items-center gap-2">
        <label for="filter-platform" class="sr-only">Platform</label>
        <select
            id="filter-platform"
            name="platform"
            onchange="this.form.submit()"
            class="h-10 cursor-pointer rounded-xl border border-border-strong bg-surface px-3 text-sm text-foreground outline-hidden transition-colors focus:border-focus focus:ring-2 focus:ring-focus"
        >
            <option value="">All platforms</option>
            {% for value, label in platforms %}
            <option value="{{ value }}" {% if platform_filter == value %}selected{% endif %}>{{ label }}</option>
            {% endfor %}
        </select>
        <button
            type="submit"
            class="inline-flex h-10 cursor-pointer items-center justify-center rounded-xl bg-primary px-4 text-sm font-medium text-primary-foreground outline-hidden transition-colors hover:bg-primary-hover"
        >
            Filter
        </button>
        {% if search_query or platform_filter %}
        <a
            href="{{ action_url }}"
            class="inline-flex h-10 cursor-pointer items-center justify-center rounded-xl border border-border-strong bg-surface px-3 text-sm font-medium text-foreground outline-hidden transition-colors hover:bg-button-hover"
        >
            Clear
        </a>
        {% endif %}
    </div>
</form>
